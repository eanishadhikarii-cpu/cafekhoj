name: Migrate Production Database

on:
  workflow_dispatch:
    inputs:
      confirm_migration:
        description: "Type 'MIGRATE_PRODUCTION' to apply Django migrations to the configured database"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  migrate:
    name: Apply Django Migrations to Production Database
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation Guard
        run: |
          if [ "${{ github.event.inputs.confirm_migration }}" != "MIGRATE_PRODUCTION" ]; then
            echo "::error::Confirmation keyword mismatch. Expected 'MIGRATE_PRODUCTION'. Aborting."
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Check Database Connectivity and Settings
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: "cafekhoj.settings"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-migration-runner-guard-key-cafekhoj' }}
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,cafekhoj-api.onrender.com"
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "Verifying Django system configuration..."
          python manage.py check

      - name: Apply Migrations
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: "cafekhoj.settings"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-migration-runner-guard-key-cafekhoj' }}
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,cafekhoj-api.onrender.com"
        run: |
          echo "Applying pending migrations to target PostgreSQL database..."
          python manage.py migrate --noinput

      - name: Record Migration Status
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: "cafekhoj.settings"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-migration-runner-guard-key-cafekhoj' }}
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,cafekhoj-api.onrender.com"
        run: |
          echo "Recording migration status..."
          python manage.py showmigrations

      - name: Audit Tables and Database Integrity
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: "cafekhoj.settings"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-migration-runner-guard-key-cafekhoj' }}
          ALLOWED_HOSTS: "localhost,127.0.0.1,testserver,cafekhoj-api.onrender.com"
        run: |
          python manage.py verify_database
