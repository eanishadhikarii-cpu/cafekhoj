name: Seed Production Database

on:
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Type 'SEED_CAFEKHOJ' to confirm running the seed command against production"
        required: true
        default: ""

permissions:
  contents: read

jobs:
  seed:
    name: Seed CafeKhoj Production Database
    runs-on: ubuntu-latest
    steps:
      - name: Validate Confirmation Guard
        run: |
          if [ "${{ github.event.inputs.confirm_production }}" != "SEED_CAFEKHOJ" ]; then
            echo "::error::Confirmation keyword mismatch. Expected 'SEED_CAFEKHOJ'. Aborting."
            exit 1
          fi

      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Safe Production Seed
        working-directory: backend
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DEBUG: "False"
          DJANGO_SETTINGS_MODULE: "cafekhoj.settings"
          SECRET_KEY: ${{ secrets.SECRET_KEY || 'production-seed-runner-guard-key-cafekhoj-2026' }}
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::DATABASE_URL secret is not set in GitHub repository secrets."
            exit 1
          fi
          echo "Executing idempotent seed_cafekhoj command against production database..."
          python manage.py seed_cafekhoj
